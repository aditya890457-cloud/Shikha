<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Letter For You 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --pink:#ff7aa8; --deep:#d6478a; --soft:#ffe3ec; --lav:#e8defa; --sky:#d9ecff;
    --ink:#5a3f55; --paper:#fffaf6;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:'Quicksand',system-ui,sans-serif;color:var(--ink);
    background:linear-gradient(135deg,var(--soft),var(--lav) 55%,var(--sky));
    background-attachment:fixed;
    display:flex;align-items:center;justify-content:center;
    padding:18px;overflow:hidden;
  }
  /* soft floating background petals */
  .bg{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
  .bg span{position:absolute;bottom:-40px;opacity:0;animation:bgrise linear infinite}
  @keyframes bgrise{0%{transform:translateY(0) rotate(0);opacity:0}10%{opacity:.55}100%{transform:translateY(-110vh) rotate(30deg);opacity:0}}

  .book{position:relative;z-index:2;width:min(580px,100%)}
  .card{
    background:var(--paper);border-radius:26px;padding:38px 32px 26px;min-height:470px;
    box-shadow:0 24px 70px rgba(214,71,138,.2),0 3px 10px rgba(0,0,0,.05);
    border:1px solid #fff;display:flex;flex-direction:column;align-items:center;text-align:center;
    background-image:radial-gradient(circle at 12% 8%,rgba(255,122,168,.08),transparent 40%),
                     radial-gradient(circle at 90% 95%,rgba(150,120,230,.08),transparent 40%);
    transition:opacity .45s ease,transform .45s ease;
  }
  .card.out{opacity:0;transform:translateX(-30px) scale(.98)}
  .card.in{opacity:0;transform:translateX(30px) scale(.98)}
  .emoji{font-size:44px;margin-bottom:6px;animation:bob 2.6s ease-in-out infinite}
  @keyframes bob{50%{transform:translateY(-6px)}}
  h1{font-family:'Dancing Script',cursive;font-size:clamp(34px,7vw,46px);color:var(--deep);margin-bottom:14px;line-height:1.15}
  .body{flex:1;display:flex;flex-direction:column;justify-content:center;gap:12px;width:100%}
  .body p{font-family:'Caveat',cursive;font-size:clamp(22px,4.8vw,27px);line-height:1.4;opacity:0;transform:translateY(8px);animation:fadeup .7s ease forwards}
  @keyframes fadeup{to{opacity:1;transform:none}}
  .list{list-style:none;text-align:left;display:block;max-width:100%;margin:0 auto;padding:0 6px}
  .list li{font-family:'Caveat',cursive;font-size:clamp(21px,4.6vw,26px);margin:7px 0;opacity:0;transform:translateX(-10px);animation:fadeleft .6s ease forwards}
  @keyframes fadeleft{to{opacity:1;transform:none}}
  .big{font-family:'Dancing Script',cursive;font-size:clamp(54px,14vw,86px);color:var(--deep);animation:pulse 1.8s ease-in-out infinite;line-height:1.1}
  @keyframes pulse{50%{transform:scale(1.07)}}
  .counter{font-family:'Quicksand',sans-serif;font-weight:600;font-size:clamp(42px,11vw,64px);color:var(--pink);letter-spacing:1px;margin:6px 0}
  .player{width:min(340px,100%);margin:10px auto 0;opacity:0;animation:fadeup .7s ease 1.2s forwards}
  .player .bar{height:8px;border-radius:99px;background:#f6d9e6;overflow:hidden}
  .player .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ff9ac0,#ff6a9a);border-radius:99px;transition:width .25s linear}
  .player .vt{margin-top:8px;font-size:13px;color:#b38aa5}

  .actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:20px}
  button{font:inherit;cursor:pointer;border:none;border-radius:999px;padding:12px 24px;font-size:15px;font-weight:600;transition:transform .15s,box-shadow .15s}
  button:hover{transform:translateY(-2px)}
  button:active{transform:scale(.97)}
  .go{background:linear-gradient(135deg,#ff8db5,#ff6a9a);color:#fff;box-shadow:0 8px 20px rgba(255,106,154,.4)}
  .next{background:#fff;color:var(--deep);border:1.5px solid #ffc2d6}
  .dots{display:flex;gap:7px;justify-content:center;margin-top:18px}
  .dots i{width:8px;height:8px;border-radius:50%;background:#f3cfe0;transition:all .3s}
  .dots i.on{background:var(--pink);width:22px;border-radius:6px}

  /* envelope */
  .env{position:relative;width:230px;height:150px;margin:8px auto 18px;background:#ffd1e0;border-radius:6px 6px 14px 14px;box-shadow:0 10px 24px rgba(214,71,138,.25)}
  .env .flap{position:absolute;top:0;left:0;width:100%;height:80px;background:#ffb3cd;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:top;transition:transform .8s ease;z-index:3;border-radius:6px 6px 0 0}
  .env .paper{position:absolute;left:14px;right:14px;top:14px;height:110px;background:#fff;border-radius:6px;transition:transform .9s ease .3s;z-index:1;display:flex;align-items:center;justify-content:center;font-family:'Dancing Script',cursive;font-size:24px;color:var(--deep)}
  .env .front{position:absolute;inset:0;background:linear-gradient(160deg,#ffc2d6,#ffd9e6);clip-path:polygon(0 100%,0 38%,50% 72%,100% 38%,100% 100%);z-index:2;border-radius:0 0 14px 14px}
  .env .seal{position:absolute;left:50%;top:62px;transform:translateX(-50%);font-size:28px;z-index:4;transition:opacity .4s}
  .env.open .flap{transform:rotateX(180deg);z-index:0}
  .env.open .paper{transform:translateY(-70px)}
  .env.open .seal{opacity:0}

  /* effects */
  .fx{position:fixed;pointer-events:none;z-index:9;user-select:none}
  @keyframes fxrise{0%{transform:translateY(0) scale(.6);opacity:1}100%{transform:translateY(-75vh) translateX(var(--dx)) scale(1.4) rotate(var(--rot));opacity:0}}
  @keyframes fxfall{0%{transform:translateY(0) rotate(0);opacity:1}100%{transform:translateY(112vh) translateX(var(--dx)) rotate(var(--rot));opacity:.9}}
  @keyframes fxtwinkle{0%{transform:scale(0);opacity:0}30%{transform:scale(1.3);opacity:1}100%{transform:scale(0) rotate(90deg);opacity:0}}
  @media(max-width:480px){.card{padding:30px 20px 22px;min-height:480px}}
</style>
</head>
<body>

<div class="bg" id="bg"></div>

<div class="book">
  <div class="card" id="card"></div>
  <div class="dots" id="dots"></div>
</div>

           "And our first VC together, when I was being so cheesy with you 🙈💗",
           "Every single second of it was so beautiful, and it's my favourite."],
    btn:"Shower me with memories 🌸", fx:"petals" },

  { type:"list", emoji:"🍓", title:"Things I adore about you",
    items:C.reasons, more:C.moreReasons,
    btn:"There's even more 💗", fx:"reveal" },

  { type:"counter", emoji:"♾️", title:"How much do I love you?",
    lines:["Let's count together..."],
    btn:"Start counting 🔢", fx:"counter" },

  { emoji:"🤍", title:"One honest thing",
    lines:["I'm sorry for hurting you. I never meant to, and I know that doesn't take the pain away.",
           "Your feelings matter to me more than my intentions ever will.",
           "I'm listening, I'm learning, and I'll be gentler with your heart.",
           "Take all the time you need. I'm here."],
    btn:"Hold my hand 🤍", fx:"hearts" },

  { type:"final", emoji:"💖", title:`I love you, ${C.nick}`,
    big:"Forever & always",
    lines:[`Yours,`,`${C.me} 🌷`],
    btn:"One last surprise 🎉", fx:"confetti" },

  { type:"voice", emoji:"🎧", title:"A little voice note",
    lines:["Okay, one more thing...", "This VN is so special for me 🤍", "Press play when you're ready."],
    btn:"Play my voice note ▶", fx:"voice" }
];

/* ============================================================
   ENGINE (you don't need to touch this)
   ============================================================ */
const card = document.getElementById("card");
const dotsEl = document.getElementById("dots");
let cur = 0, busy = false, vn = null;

pages.forEach(()=>dotsEl.appendChild(document.createElement("i")));

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}

function build(p, i){
  let h = "";
  if(p.type==="cover"){
    h += `<div class="env" id="env"><div class="flap"></div><div class="paper">${esc(C.her)} 💗</div><div class="front"></div><div class="seal">💗</div></div>`;
  } else {
    h += `<div class="emoji">${p.emoji}</div>`;
  }
  h += `<h1>${esc(p.title)}</h1><div class="body" id="body">`;
  if(p.type==="list"){
    h += `<ul class="list" id="list">` + p.items.map((t,k)=>`<li style="animation-delay:${.25+k*.35}s">💗 ${esc(t)}</li>`).join("") + `</ul>`;
  }
  if(p.type==="final"){ h += `<div class="big">${esc(p.big)}</div>`; }
  if(p.type==="counter"){ h += `<div class="counter" id="count">0</div>`; }
  (p.lines||[]).forEach((t,k)=>{ h += `<p style="animation-delay:${.3+k*.55}s">${esc(t)}</p>`; });
  if(p.type==="voice"){
    h += `<div class="player"><div class="bar"><i id="vbar"></i></div><div class="vt" id="vtime">0:00</div></div>`;
  }
  h += `</div><div class="actions"><button class="go" id="go">${p.btn}</button>`;
  if(i < pages.length-1 && p.type!=="cover") h += `<button class="next" id="nx">Next ➜</button>`;
  if(i === pages.length-1) h += `<button class="next" id="again">Read again 🔁</button>`;
  h += `</div>`;
  return h;
}

function render(i, instant){
  const p = pages[i];
  const apply = ()=>{
    if(vn) vn.pause();
    card.innerHTML = build(p,i);
    [...dotsEl.children].forEach((d,k)=>d.classList.toggle("on",k===i));
    document.getElementById("go").onclick = ()=>run(p);
    const nx = document.getElementById("nx"); if(nx) nx.onclick = next;
    const ag = document.getElementById("again"); if(ag) ag.onclick = ()=>go(0);
    card.classList.remove("out"); card.classList.add("in");
    requestAnimationFrame(()=>requestAnimationFrame(()=>card.classList.remove("in")));
  };
  if(instant){ apply(); return; }
  card.classList.add("out");
  setTimeout(apply, 420);
}
function go(i){ if(busy) return; cur = i; render(i); }
function next(){ if(cur < pages.length-1) go(cur+1); }

/* ---------- special buttons ---------- */
function run(p){
  switch(p.fx){
    case "envelope":
      document.getElementById("env").classList.add("open");
      spawn(["💗","💖","✨"],16,"rise");
      busy = true; setTimeout(()=>{ busy=false; next(); },1700);
      break;
    case "stars":    spawn(["⭐","✨","🌟","💫"],34,"twinkle"); break;
    case "voice": {
      const btn = document.getElementById("go");
      if(!vn){
        vn = new Audio(C.voice);
        vn.addEventListener("timeupdate",()=>{
          const b = document.getElementById("vbar"), t = document.getElementById("vtime");
          if(b && vn.duration) b.style.width = (vn.currentTime/vn.duration*100)+"%";
          if(t){ const s = Math.floor(vn.currentTime); t.textContent = Math.floor(s/60)+":"+String(s%60).padStart(2,"0"); }
        });
        vn.addEventListener("ended",()=>{
          const b = document.getElementById("go"); if(b) b.textContent = "Play again ▶";
          spawn(["💗","💖","💕","🌸"],34,"rise");
        });
        vn.addEventListener("error",()=>{
          const t = document.getElementById("vtime");
          if(t) t.textContent = "Sorry, the voice note could not be played";
        });
      }
      if(vn.paused){ vn.play().catch(()=>{}); btn.textContent = "Pause ⏸"; spawn(["🎧","💗","✨"],14,"rise"); }
      else { vn.pause(); btn.textContent = "Play my voice note ▶"; }
      break; }
    case "petals":   spawn(["🌸","🌷","🌺","💮"],38,"fall"); break;
    case "hearts":   spawn(["💗","💖","💕","🤍"],30,"rise"); break;
    case "balloons": spawn(["🎈"],18,"rise"); break;
    case "confetti":
      spawn(["🎉","🎊","💖","✨","🌸","💗"],60,"fall");
      spawn(["💖","💗","💕"],26,"rise");
      break;
    case "reveal": {
      const ul = document.getElementById("list");
      const p2 = pages[cur];
      if(!p2.shown){
        p2.shown = true;
        p2.more.forEach((t,k)=>{
          const li = document.createElement("li");
          li.innerHTML = "💞 "+esc(t);
          li.style.animationDelay = (k*.4)+"s";
          ul.appendChild(li);
        });
        document.getElementById("go").textContent = "I could go on forever 🥹";
      }
      spawn(["💗","💕"],18,"rise");
      break; }
    case "counter": {
      const el = document.getElementById("count");
      const goBtn = document.getElementById("go");
      goBtn.disabled = true;
      const target = 1000000, dur = 3200, t0 = performance.now();
      (function tick(t){
        const k = Math.min(1,(t-t0)/dur), e = 1-Math.pow(1-k,3);
        el.textContent = Math.floor(e*target).toLocaleString();
        if(k<1){ requestAnimationFrame(tick); }
        else {
          el.textContent = "∞";
          const body = document.getElementById("body");
          const msg = document.createElement("p");
          msg.textContent = "...and I still wouldn't be done. 💗";
          msg.style.animationDelay = "0s";
          body.appendChild(msg);
          spawn(["💗","💖","♾️"],24,"rise");
          goBtn.disabled = false; goBtn.textContent = "Again 🔁";
        }
      })(performance.now());
      break; }
  }
}

/* ---------- particle effects ---------- */
function spawn(list, n, mode){
  for(let i=0;i<n;i++){
    const s = document.createElement("span");
    s.className = "fx";
    s.textContent = list[Math.floor(Math.random()*list.length)];
    const size = 18 + Math.random()*26;
    s.style.fontSize = size+"px";
    s.style.setProperty("--dx",(Math.random()*160-80)+"px");
    s.style.setProperty("--rot",(Math.random()*360-180)+"deg");
    const delay = Math.random()*(mode==="twinkle"?1.2:0.9);
    if(mode==="rise"){
      s.style.left = (8+Math.random()*84)+"%"; s.style.bottom = "-30px";
      s.style.animation = `fxrise ${3+Math.random()*2.5}s ease-out ${delay}s forwards`;
    } else if(mode==="fall"){
      s.style.left = (Math.random()*100)+"%"; s.style.top = "-40px";
      s.style.animation = `fxfall ${3.4+Math.random()*3}s linear ${delay}s forwards`;
    } else {
      s.style.left = (Math.random()*92)+"%"; s.style.top = (Math.random()*88)+"%";
      s.style.animation = `fxtwinkle ${1.6+Math.random()*1.2}s ease-in-out ${delay}s forwards`;
    }
    document.body.appendChild(s);
    setTimeout(()=>s.remove(), 8000);
  }
}

/* ---------- ambient background ---------- */
(function(){
  const bg = document.getElementById("bg"), em = ["🌸","💗","✨","🤍","🌷"];
  for(let i=0;i<18;i++){
    const s = document.createElement("span");
    s.textContent = em[i%em.length];
    s.style.left = Math.random()*100+"%";
    s.style.fontSize = (12+Math.random()*18)+"px";
    s.style.animationDuration = (10+Math.random()*10)+"s";
    s.style.animationDelay = (Math.random()*12)+"s";
    bg.appendChild(s);
  }
})();

render(0, true);
</script>
</body>
</html>
